name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uglify-js
        run: npm install -g uglify-js

      - name: Build main.min.js
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Check GitHub Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify required homepage content
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          for term in \
            "First-year PhD candidate" \
            "Shanghai Jiao Tong University" \
            "MINIMAX" \
            "Tencent WXG" \
            "Shanghai AI Lab" \
            "Zhiyuan Honor Scholarship" \
            "SynLogic" \
            "Vision4Chart" \
            "Universal_Truthfulness_Hyperplane" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations" \
            "jliugi@connect.ust.hk" \
            "Vicent0205" \
            "tbK9jl4AAAAJ" \
            "junteng88716710"; do
            grep -q "$term" _site/index.html
          done
          for publication in SynLogic "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" C-Eval "Composing Parameter-Efficient Modules"; do
            grep -q "$publication" _site/publications/index.html
            grep -q "$publication" _site/cv/index.html
          done
          echo "Generated top-level pages:"
          find _site -maxdepth 2 -name index.html | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
